async function operator(proxies) {
  // === 配置参数 ===
  const CONCURRENCY = 5;      // 并发检测数（建议 3-8）
  const TIMEOUT = 4000;       // 单次请求超时时间（毫秒）

  // === AI 平台检测定义 ===
  const AI_SERVICES = [
    {
      name: 'GPT',
      url: 'https://chatgpt.com',
      check: (res) => res.status === 200 && !/vpn|blocked|denied|access denied/i.test(res.body || '')
    },
    {
      name: 'Claude',
      url: 'https://claude.ai/login',
      check: (res) => res.status === 200 && !/app_unavailable_country|blocked|denied/i.test(res.body || '')
    },
    {
      name: 'Gemini',
      url: 'https://gemini.google.com',
      check: (res) => res.status === 200
    }
  ];

  try {
    // 初始化 HTTP Meta 测试客户端
    const http = await produceHTTP({
      timeout: TIMEOUT,
      headers: {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
      }
    });

    // 分批并发处理
    for (let i = 0; i < proxies.length; i += CONCURRENCY) {
      const chunk = proxies.slice(i, i + CONCURRENCY);

      await Promise.all(chunk.map(async (proxy) => {
        let isUnlocked = false;

        for (const ai of AI_SERVICES) {
          try {
            const res = await http.get(ai.url, { proxy });
            if (ai.check(res)) {
              isUnlocked = true;
              break; // 只要解锁任意一个 AI，即判定成功并跳出本次检测
            }
          } catch (e) {
            // 超时或阻断自动忽略
          }
        }

        // === 修改节点名称：末尾直接拼接 |AI线路 ===
        if (isUnlocked) {
          proxy.name = `${proxy.name}|AI线路`;
        }
      }));
    }
  } catch (e) {
    console.error('AI 检测脚本运行异常: ' + e);
  }

  return proxies;
}
