async function operator(proxies) {
  let http;

  // Sub-Store 在宿主机，访问 Docker 映射到宿主机的端口直接用 127.0.0.1
  const META_BACKEND = 'http://127.0.0.1:9876';

  try {
    http = await produceHTTP({
      backend: META_BACKEND,
      timeout: 5000,
      headers: {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
      }
    });
  } catch (e) {
    if (proxies.length > 0) {
      proxies[0].name = `${proxies[0].name} [HTTP Meta未连通]`;
    }
    return proxies;
  }

  const concurrency = 5;
  for (let i = 0; i < proxies.length; i += concurrency) {
    const chunk = proxies.slice(i, i + concurrency);
    await Promise.all(
      chunk.map(async (proxy) => {
        let isAI = false;

        // 1. OpenAI / ChatGPT 检测 (401 或 200 状态码代表节点支持)
        try {
          const resGPT = await http.get('https://api.openai.com/v1/models', { proxy });
          if (resGPT && (resGPT.status === 401 || resGPT.status === 200)) {
            isAI = true;
          }
        } catch (e) {}

        // 2. Gemini 检测
        if (!isAI) {
          try {
            const resGemini = await http.get('https://gemini.google.com', { proxy });
            if (resGemini && (resGemini.status === 200 || resGemini.status === 302)) {
              isAI = true;
            }
          } catch (e) {}
        }

        // 标记解锁节点
        if (isAI) {
          proxy.name = `${proxy.name}|AI线路`;
        }
      })
    );
  }
  return proxies;
}
