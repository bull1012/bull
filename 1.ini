[custom]
; 基础设置
resource_type = file
ruleset_format = mrs

; --------------------------------------------------
; 策略组配置 (Group Definitions)
; 说明：
; 1. 策略组/节点引用使用 [] 前缀
; 2. 避免在引用名中留有未转义的特殊空格
; --------------------------------------------------

; 1. 主控制组
custom_proxy_group = 🚀 节点选择`select`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连`.*

; 2. 专项服务策略组
custom_proxy_group = 📹 YouTube`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 🍀 Google`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 🤖 AI`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 👨🏿‍💻 GitHub`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 🐬 whatsapp`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 🪟 Microsoft`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 🎵 TikTok`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 📲 Telegram`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 🎥 NETFLIX`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = ✈️ Speedtest`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 💶 PayPal`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连
custom_proxy_group = 🍎 Apple`select`[]🟢 直连`[]🚀 节点选择
custom_proxy_group = 🎯 全球直连`select`[]🟢 直连`[]🚀 节点选择
custom_proxy_group = 🐟 漏网之鱼`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🟢 直连

; 3. 自动选优与故障转移组（必须放在筛选组之前）
custom_proxy_group = 🔯 香港故转`fallback`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group = 🔯 日本故转`fallback`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group = ♻️ 香港自动`url-test`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group = ♻️ 日本自动`url-test`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group = ♻️ 美国自动`url-test`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$`http://www.gstatic.com/generate_204`300,,20
custom_proxy_group = ♻️ 自动选择`url-test`^((?!(直连)).)*$`http://www.gstatic.com/generate_204`300,,20

; 4. 地区筛选组（利用正则提取订阅中的节点）
custom_proxy_group = 🇭🇰 香港节点`select`(?i)港|hk|hongkong|hong kong
custom_proxy_group = 🇯🇵 日本节点`select`(?i)日|jp|japan
custom_proxy_group = 🇺🇲 美国节点`select`(?i)美|us|unitedstates|united states
custom_proxy_group = 🌐 全部节点`select`.*


; --------------------------------------------------
; 规则集引用配置 (Rulesets)
; --------------------------------------------------

ruleset = 🟢 直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
ruleset = 🍎 Apple,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-cn.mrs
ruleset = 🚀 节点选择,https://raw.githubusercontent.com/qcyhub/rule/master/ProxyLite.list
ruleset = 🤖 AI,https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/shadowrocket/all.list
ruleset = 👨🏿‍💻 GitHub,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs
ruleset = 📹 YouTube,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
ruleset = 🍀 Google,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs
ruleset = 🐬 whatsapp,https://gh-proxy.com/raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Whatsapp/Whatsapp.list
